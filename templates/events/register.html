{% extends "base.html" %}
{% block title %}Register — {{ event.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-1"><i class="bi bi-check-circle"></i> Register for Event</h3>
        <p class="text-muted mb-4">{{ event.title }}</p>

        <p class="mb-3">
          <i class="bi bi-calendar-event text-primary"></i>
          {{ event.start_datetime|date:"M d, Y · H:i" }}
          {% if event.venue %} · {{ event.venue }}{% endif %}
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Notes (optional)</label>
            <textarea name="notes" rows="3" class="form-control"
                      maxlength="200"
                      placeholder="Anything you'd like the organizers to know?"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> Confirm Registration
            </button>
            <a href="{% url 'event_detail' event.id %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
