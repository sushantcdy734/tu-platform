{% extends "base.html" %}
{% block title %}New Complaint{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-1"><i class="bi bi-ticket-detailed"></i> Submit a Complaint</h3>
        <p class="text-muted mb-4">
          Your complaint will go to {{ user.college.name }}'s staff.
        </p>

        <form method="post">
          {% csrf_token %}

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <select name="category" class="form-select" required>
                {% for key, label in category_choices %}
                  <option value="{{ key }}"
                    {% if form_data.category == key %}selected{% endif %}>
                    {{ label }}
                  </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Priority</label>
              <select name="priority" class="form-select" required>
                {% for key, label in priority_choices %}
                  <option value="{{ key }}"
                    {% if form_data.priority == key %}selected{% elif not form_data and key == 'normal' %}selected{% endif %}>
                    {{ label }}
                  </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" name="subject" class="form-control"
                   value="{{ form_data.subject|default:'' }}"
                   placeholder="Short summary" required maxlength="200">
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" rows="6" class="form-control"
                      placeholder="Describe the issue in detail..."
                      required>{{ form_data.description|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send"></i> Submit Complaint
            </button>
            <a href="{% url 'complaint_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
