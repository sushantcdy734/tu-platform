{% extends "base.html" %}
{% block title %}Request Document{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-1"><i class="bi bi-file-earmark-text"></i> Request a Document</h3>
        <p class="text-muted mb-4">This will be sent to {{ user.college.name }}'s administration.</p>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Document type</label>
            <select name="document_type" class="form-select" required>
              <option value="">— Select —</option>
              {% for key, label in type_choices %}
                <option value="{{ key }}" {% if form_data.document_type == key %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Number of copies</label>
            <input type="number" name="copies" min="1" value="{{ form_data.copies|default:1 }}" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Purpose</label>
            <textarea name="purpose" rows="4" class="form-control" required
                      placeholder="Explain why you need this document..."
                      >{{ form_data.purpose|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send"></i> Submit Request
            </button>
            <a href="{% url 'document_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
