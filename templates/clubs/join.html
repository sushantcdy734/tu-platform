{% extends "base.html" %}
{% block title %}Join {{ club.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-1"><i class="bi bi-person-plus"></i> Join {{ club.name }}</h3>
        <p class="text-muted mb-4">{{ club.get_category_display }} · {{ club.college.name }}</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Why do you want to join? (optional)</label>
            <textarea name="reason" rows="4" class="form-control"
                      placeholder="Share what motivates you to join this club..."></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send"></i> Submit Request
            </button>
            <a href="{% url 'club_detail' club.id %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
