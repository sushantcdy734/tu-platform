{% extends "base.html" %}
{% block title %}Post Announcement — {{ club.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-1"><i class="bi bi-megaphone"></i> New Announcement</h3>
        <p class="text-muted mb-4">Posting to <strong>{{ club.name }}</strong></p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required maxlength="200">
          </div>
          <div class="mb-3">
            <label class="form-label">Body</label>
            <textarea name="body" rows="6" class="form-control" required></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-megaphone"></i> Post
            </button>
            <a href="{% url 'club_detail' club.id %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
