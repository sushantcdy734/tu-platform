{% extends "base.html" %}
{% block title %}Report Issue — {{ equipment.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-1"><i class="bi bi-wrench"></i> Report an Issue</h3>
        <p class="text-muted mb-4">
          {{ equipment.name }} · {{ equipment.lab.name }}
        </p>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Describe the issue</label>
            <textarea name="issue" rows="5" class="form-control" required
                      placeholder="What's wrong with this equipment?"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">
              <i class="bi bi-send"></i> Submit Report
            </button>
            <a href="{% url 'lab_detail' equipment.lab.id %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
